; Global defaults. Override per site with /var/www/<site>/public/.user.ini (or /var/www/<site>/.user.ini)
memory_limit = 256M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_vars = 5000
expose_php = Off
date.timezone = UTC

display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
