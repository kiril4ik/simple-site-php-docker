# Site folder = first label of the host name ("www." is ignored)
#   test-website.example.com      -> /var/www/test-website
#   www.my-website.example.com    -> /var/www/my-website
map $host $site {
    ~^(www\.)?(?<sub>[a-z0-9-]+)\.  $sub;
    default                         "";
}

# Coolify's Traefik terminates TLS; tell PHP the original scheme
map $http_x_forwarded_proto $fwd_https {
    https   on;
    default "";
}

# Real client IP from Traefik (Docker networks)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

client_max_body_size 256M;
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

# Internal healthcheck (container-only port, not routed by Coolify)
server {
    listen 127.0.0.1:8081;
    access_log off;
    location / { return 200 "ok\n"; }
}

server {
    listen 80 default_server;
    server_name _;

    # Unknown subdomain / missing folder -> 404
    if ($site = "") { return 404; }
    if (!-d /var/www/$site) { return 404; }

    # Use ./public as docroot when it exists
    set $docroot /var/www/$site;
    if (-d /var/www/$site/public) { set $docroot /var/www/$site/public; }
    root $docroot;

    index index.php index.html index.htm;

    access_log /var/log/nginx/access.log combined;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param HTTPS           $fwd_https if_not_empty;
        fastcgi_param SITE_NAME       $site;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Static asset caching
    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Block dotfiles (.env, .git, .user.ini ...) except .well-known
    location ~ /\.(?!well-known) { deny all; }

    # Block common sensitive files
    location ~* (composer\.(json|lock)|package(-lock)?\.json|\.sql|\.bak|\.log)$ { deny all; }
}
